<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register for the Course | Appscyclone</title>
    <meta
      name="description"
      content="Appscyclone frontend training. Explore courses, meet instructors and register to learn."
    />
    <link
      rel="preload"
      href="assets/fonts/plus-jakarta-sans-400.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/shared.css" />
    <link rel="stylesheet" href="assets/css/components/header.css" />
    <link rel="stylesheet" href="assets/css/pages/registered-students.css" />
    <script src="assets/js/main.js" defer></script>
  </head>
  <body class="page-register">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header" data-figma-name="top-nav/new">
      <div class="container header-inner">
        <a href="index.html" class="brand" aria-label="Appscyclone home">
          <img src="assets/images/brand/logo.svg" alt="Appscyclone" width="179" height="32" />
        </a>
        <nav aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="courses.html">Courses</a>
          <a class="button button--small" href="registered-students.html">Registered</a>
        </nav>
      </div>
    </header>
    <main id="main" class="register-main container" data-figma-node="1:913">
      <div class="registration">
        <h1 class="page-title">Register for the Course</h1>
        <form class="registration-form">
          <div class="form-fields">
            <div class="form-field">
              <label for="name">Name</label>
              <input
                id="name"
                name="name"
                autocomplete="name"
                placeholder="Enter name"
                required
                maxlength="100"
              />
            </div>
            <div class="form-field">
              <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="Enter your email"
                required
              />
            </div>
            <div class="form-field">
              <label for="phone">Phone</label>
              <input
                id="phone"
                name="phone"
                type="tel"
                autocomplete="tel"
                placeholder="Enter your phone number"
                required
                pattern="[+0-9\(\)\s\-]{8,20}"
              />
            </div>
            <div class="form-field">
              <label for="learning-form">Learning form</label>
              <select id="learning-form" name="learning-form">
                <option value="offline">Learn offline</option>
                <option value="online">Learn online</option>
              </select>
            </div>
            <div class="form-field form-field--full">
              <label for="facebook">Facebook URL</label>
              <input
                id="facebook"
                name="facebook"
                type="url"
                placeholder="Enter your facebook URL"
              />
            </div>
            <div class="form-field form-field--full">
              <label for="opinion">Personal opinion</label>
              <textarea id="opinion" name="opinion" rows="3" maxlength="2000"></textarea>
            </div>
          </div>
          <button class="button confirm-button" type="submit" disabled>Confirm</button>
          <noscript>
            <p>This demo needs JavaScript to validate the form. No registration is sent.</p>
          </noscript>
          <p class="form-result" role="status" tabindex="-1" hidden></p>
        </form>
      </div>
    </main>
    <footer class="site-footer" data-figma-name="footer">
      <div class="container">
        <div class="footer-grid">
          <div class="footer-cta">
            <a class="brand" href="index.html">
              <img
                src="assets/images/brand/logo.svg"
                alt="Appscyclone"
                width="179"
                height="32"
                loading="lazy"
              />
            </a>
            <p>
              Wanna learn with us?
              <br />
              Get in touch
            </p>
            <a class="button" href="registered-students.html">Registered</a>
          </div>
          <div class="footer-links">
            <h2>Navigation</h2>
            <a href="index.html">Home</a>
            <a href="courses.html">Course</a>
          </div>
          <div class="footer-office">
            <h2>Head Office</h2>
            <address>
              168/6 Bui Thi Xuan Street,
              <br />
              Ward 3, Tan Binh District,
              <br />
              Ho Chi Minh City, Vietnam
            </address>
            <div class="social-links">
              <a href="https://twitter.com/" aria-label="Twitter">
                <img
                  src="assets/images/icons/twitter.svg"
                  alt=""
                  width="32"
                  height="32"
                  loading="lazy"
                />
              </a>
              <a href="https://www.whatsapp.com/" aria-label="WhatsApp">
                <img
                  src="assets/images/icons/whatsapp.svg"
                  alt=""
                  width="32"
                  height="32"
                  loading="lazy"
                />
              </a>
              <a href="https://www.facebook.com/" aria-label="Facebook">
                <img
                  src="assets/images/icons/facebook.svg"
                  alt=""
                  width="32"
                  height="32"
                  loading="lazy"
                />
              </a>
            </div>
          </div>
        </div>
        <p class="copyright">Copyright © 2023. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
